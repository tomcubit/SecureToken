name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shell:
    name: Shell — shellcheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: |
          for f in scripts/securetoken.sh scripts/rmm/ninjaone-wrapper.sh \
                   scripts/secure-token-transfer.sh tests/securetoken_test.sh; do
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          shellcheck -s bash \
            scripts/securetoken.sh \
            scripts/rmm/ninjaone-wrapper.sh \
            scripts/secure-token-transfer.sh \
            tests/securetoken_test.sh

      - name: Unit tests
        run: bash tests/securetoken_test.sh

  integration:
    name: Shell — end-to-end against mock macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The mocks emulate sysadminctl/dscl/profiles/sw_vers/diskutil with
      # Apple's documented Secure Token semantics (no credential-free grants,
      # '-' passwords prompt-and-block). Runner is disposable, so installing
      # into /usr/bin//usr/sbin is fine.
      - name: Install mock macOS commands
        run: sudo bash tests/mocks/install-mocks.sh
      - name: End-to-end integration tests
        run: sudo bash tests/integration_test.sh

  swift:
    name: Swift — build + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  macos-shell:
    name: Shell — run tests on macOS bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm bash version
        run: /bin/bash --version | head -1
      # The core targets the bash 3.2 that ships with macOS; run the suite with
      # that exact interpreter, not Homebrew's newer bash.
      - name: Unit tests under /bin/bash
        run: /bin/bash tests/securetoken_test.sh
      - name: Help/version smoke test
        run: |
          /bin/bash scripts/securetoken.sh --version
          /bin/bash scripts/securetoken.sh --help > /dev/null
